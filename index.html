<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Marino Dashboards</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a1a 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            margin: 0;
        }

        .header p {
            color: #999;
            margin-top: 2px;
            font-size: 12px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #4CAF50;
            font-size: 14px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .section-title {
            color: white;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card-header {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-badge {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-green {
            background: #d4edda;
            color: #155724;
        }

        .badge-yellow {
            background: #fff3cd;
            color: #856404;
        }

        .badge-red {
            background: #f8d7da;
            color: #721c24;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #666;
            font-size: 13px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .nps-chart-container {
            position: relative;
            height: 200px;
            margin-bottom: 15px;
        }

        .nps-legend {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-title {
            font-size: 14px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 14px;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted #999;
            cursor: help;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            white-space: normal;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        .meta-alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 13px;
            color: #856404;
            font-weight: 600;
        }

        .meta-success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }

        .last-update {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .card {
                padding: 15px;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-content">
                <img src="https://sanmarinofiat.com.br/wp-content/uploads/2024/12/San-Marino_branco-1536x307.png" alt="San Marino">
                <div>
                    <h1>San Marino Dashboards</h1>
                    <p>Monitoramento em Tempo Real de Indicadores</p>
                </div>
            </div>
            <div class="header-status">
                <div class="status-dot"></div>
                <span>Conectado</span>
            </div>
        </div>

        <!-- SEÇÃO AVALIAÇÕES DE VEÍCULOS -->
        <div style="margin-bottom: 40px;">
            <h2 class="section-title">🚗 Avaliações de Veículos</h2>
            <div class="dashboard-grid" id="avaliacoes-grid">
                <!-- Cards de avaliações serão inseridos aqui -->
            </div>
        </div>

        <!-- SEÇÃO NPS -->
        <div style="margin-bottom: 40px;">
            <h2 class="section-title">⭐ NPS (Net Promoter Score)</h2>
            <div class="dashboard-grid" id="nps-grid">
                <!-- Cards de NPS serão inseridos aqui -->
            </div>
        </div>

        <!-- FOOTER -->
        <div class="last-update">
            <span id="last-update-time">Última atualização: --:--:--</span>
        </div>
    </div>

    <!-- MODAL DE DETALHES -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Detalhes</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Conteúdo dinâmico -->
            </div>
        </div>
    </div>

    <script>
        // DADOS DE AVALIAÇÕES (Estrutura para conectar com Google Sheets)
        const AVALIACOES_LOJAS = {
            'Matriz': { count: 75, conversion: 28.5, ticket: 12500 },
            'Zona Sul': { count: 74, conversion: 25.6, ticket: 11800 },
            'Gravataí': { count: 0, conversion: 0, ticket: 0 },
            'Viamão': { count: 51, conversion: 21.5, ticket: 10200 },
            'Multimarcas': { count: 0, conversion: 0, ticket: 0 }
        };

        // DADOS DE NPS (Estrutura para conectar com Google Sheets)
        const NPS_LOJAS = {
            'Matriz': {
                vendas: { promotoras: 32, neutras: 28, detratoras: 15, meta: 94 },
                pos_vendas: { promotoras: 28, neutras: 32, detratoras: 15, meta: 90 }
            },
            'Zona Sul': {
                vendas: { promotoras: 38, neutras: 22, detratoras: 15, meta: 94 },
                pos_vendas: { promotoras: 35, neutras: 26, detratoras: 14, meta: 90 }
            },
            'Gravataí': {
                vendas: { promotoras: 28, neutras: 32, detratoras: 15, meta: 94 },
                pos_vendas: { promotoras: 26, neutras: 34, detratoras: 15, meta: 90 }
            },
            'Viamão': {
                vendas: { promotoras: 35, neutras: 25, detratoras: 15, meta: 94 },
                pos_vendas: { promotoras: 32, neutras: 28, detratoras: 15, meta: 90 }
            }
        };

        // CORES NPS
        const NPS_COLORS = {
            promotoras: '#28a745',  // Verde
            neutras: '#ffc107',     // Amarelo
            detratoras: '#dc3545'   // Vermelho
        };

        function calcularNPS(promotoras, detratoras, total) {
            return Math.round(((promotoras - detratoras) / total) * 100);
        }

        function criarCardAvaliacoes() {
            const grid = document.getElementById('avaliacoes-grid');
            let html = '';

            Object.entries(AVALIACOES_LOJAS).forEach(([loja, data]) => {
                if (data.count === 0) return; // Pula lojas vazias

                const badge = data.conversion >= 25 ? 'badge-green' : 'badge-yellow';
                const badgeText = data.conversion >= 25 ? '✅ Acima da meta' : '⚠️ Abaixo da meta';

                html += `
                    <div class="card" onclick="mostrarDetalhesAvaliacoes('${loja}', ${data.count}, ${data.conversion}, ${data.ticket})">
                        <div class="card-header">
                            <span>${loja}</span>
                            <span class="card-badge ${badge}">${badgeText}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">📊 Avaliações</span>
                            <span class="metric-value">${data.count}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">🔄 Taxa Conversão</span>
                            <span class="metric-value" style="color: ${data.conversion >= 25 ? '#28a745' : '#dc3545'}">${data.conversion}%</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">💰 Ticket Médio</span>
                            <span class="metric-value">R$ ${data.ticket.toLocaleString('pt-BR')}</span>
                        </div>
                        <p style="font-size: 12px; color: #999; margin-top: 10px;">👆 Clique para mais detalhes</p>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function criarCardNPS() {
            const grid = document.getElementById('nps-grid');
            let html = '';
            let totalPromotoras = 0, totalDetratoras = 0, totalRespostas = 0;

            Object.entries(NPS_LOJAS).forEach(([loja, dados]) => {
                const vendas = dados.vendas;
                const posvenda = dados.pos_vendas;

                // Calcula NPS Vendas
                const totalVendas = vendas.promotoras + vendas.neutras + vendas.detratoras;
                const npsVendas = calcularNPS(vendas.promotoras, vendas.detratoras, totalVendas);
                const vendasMeta = vendas.meta;
                const vendasFaltam = Math.max(0, vendasMeta - npsVendas);
                const vendasFaltamNotas = Math.ceil((vendasFaltam / 100) * totalVendas);

                // Calcula NPS Pós-vendas
                const totalPosvenda = posvenda.promotoras + posvenda.neutras + posvenda.detratoras;
                const npsPosvenda = calcularNPS(posvenda.promotoras, posvenda.detratoras, totalPosvenda);
                const posvendaMeta = posvenda.meta;
                const posvrendaFaltam = Math.max(0, posvendaMeta - npsPosvenda);
                const posvrendaFaltamNotas = Math.ceil((posvrendaFaltam / 100) * totalPosvenda);

                const vendasBadge = npsVendas >= vendasMeta ? 'badge-green' : (npsVendas >= 75 ? 'badge-yellow' : 'badge-red');
                const posvBadge = npsPosvenda >= posvendaMeta ? 'badge-green' : (npsPosvenda >= 75 ? 'badge-yellow' : 'badge-red');

                totalPromotoras += vendas.promotoras + posvenda.promotoras;
                totalDetratoras += vendas.detratoras + posvenda.detratoras;
                totalRespostas += totalVendas + totalPosvenda;

                html += `
                    <div class="card" onclick="mostrarDetalhesNPS('${loja}')">
                        <div class="card-header">
                            <span>${loja}</span>
                        </div>

                        <!-- VENDAS -->
                        <div class="detail-section">
                            <div class="detail-title">Vendas de Veículos</div>
                            <div class="metric-row">
                                <span class="metric-label">NPS</span>
                                <span class="metric-value" style="color: ${npsVendas >= vendasMeta ? '#28a745' : '#dc3545'}">${npsVendas}</span>
                                <span class="card-badge ${vendasBadge}">Meta: ${vendasMeta}</span>
                            </div>
                            ${vendasFaltam > 0 ? `
                                <div class="meta-alert">
                                    ⚠️ Faltam ${vendasFaltamNotas} notas promotoras
                                </div>
                            ` : `
                                <div class="meta-alert meta-success">
                                    ✅ Meta atingida!
                                </div>
                            `}
                        </div>

                        <!-- PÓS-VENDAS -->
                        <div class="detail-section">
                            <div class="detail-title">Pós-Vendas</div>
                            <div class="metric-row">
                                <span class="metric-label">NPS</span>
                                <span class="metric-value" style="color: ${npsPosvenda >= posvendaMeta ? '#28a745' : '#dc3545'}">${npsPosvenda}</span>
                                <span class="card-badge ${posvBadge}">Meta: ${posvendaMeta}</span>
                            </div>
                            ${posvrendaFaltam > 0 ? `
                                <div class="meta-alert">
                                    ⚠️ Faltam ${posvrendaFaltamNotas} notas promotoras
                                </div>
                            ` : `
                                <div class="meta-alert meta-success">
                                    ✅ Meta atingida!
                                </div>
                            `}
                        </div>

                        <p style="font-size: 12px; color: #999; margin-top: 10px;">👆 Clique para gráficos detalhados</p>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function mostrarDetalhesAvaliacoes(loja, count, conversion, ticket) {
            const modal = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = `Avaliações - ${loja}`;
            body.innerHTML = `
                <div class="detail-section">
                    <div class="detail-title">Resumo das Avaliações</div>
                    <div class="detail-row">
                        <span>Total de Avaliações</span>
                        <span style="font-weight: 700; color: #667eea;">${count}</span>
                    </div>
                    <div class="detail-row">
                        <span>Taxa de Conversão</span>
                        <span style="font-weight: 700; color: ${conversion >= 25 ? '#28a745' : '#dc3545'};">${conversion}%</span>
                    </div>
                    <div class="detail-row">
                        <span>Ticket Médio</span>
                        <span style="font-weight: 700; color: #667eea;">R$ ${ticket.toLocaleString('pt-BR')}</span>
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-title">Métricas Detalhadas</div>
                    <div class="detail-row">
                        <span>Conversões (aprox.)</span>
                        <span style="font-weight: 700;">${Math.round(count * conversion / 100)} avaliações</span>
                    </div>
                    <div class="detail-row">
                        <span>Ticket Total</span>
                        <span style="font-weight: 700;">R$ ${(count * ticket).toLocaleString('pt-BR')}</span>
                    </div>
                </div>
            `;

            modal.classList.add('active');
        }

        function mostrarDetalhesNPS(loja) {
            const modal = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const dados = NPS_LOJAS[loja];

            const vendas = dados.vendas;
            const posvenda = dados.pos_vendas;

            const totalVendas = vendas.promotoras + vendas.neutras + vendas.detratoras;
            const npsVendas = calcularNPS(vendas.promotoras, vendas.detratoras, totalVendas);
            const vendasFaltam = Math.max(0, vendas.meta - npsVendas);
            const vendasFaltamNotas = Math.ceil((vendasFaltam / 100) * totalVendas);

            const totalPosvenda = posvenda.promotoras + posvenda.neutras + posvenda.detratoras;
            const npsPosvenda = calcularNPS(posvenda.promotoras, posvenda.detratoras, totalPosvenda);
            const posvrendaFaltam = Math.max(0, posvenda.meta - npsPosvenda);
            const posvrendaFaltamNotas = Math.ceil((posvrendaFaltam / 100) * totalPosvenda);

            title.textContent = `NPS Detalhado - ${loja}`;
            body.innerHTML = `
                <!-- VENDAS -->
                <div class="detail-section">
                    <div class="detail-title">Vendas de Veículos</div>
                    <div class="detail-row">
                        <span>NPS</span>
                        <span style="font-weight: 700; font-size: 20px; color: ${npsVendas >= vendas.meta ? '#28a745' : '#dc3545'};">${npsVendas}</span>
                    </div>
                    <div class="detail-row">
                        <span>Meta</span>
                        <span style="font-weight: 700;">${vendas.meta}</span>
                    </div>
                    ${vendasFaltam > 0 ? `
                        <div class="meta-alert">
                            ⚠️ Faltam <strong>${vendasFaltamNotas} notas promotoras</strong> para atingir a meta
                        </div>
                    ` : `
                        <div class="meta-alert meta-success">
                            ✅ Meta atingida!
                        </div>
                    `}

                    <div style="margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 6px;">
                        <div class="detail-row">
                            <span>🟢 Promotoras (9-10)</span>
                            <span style="font-weight: 700; color: #28a745;">${vendas.promotoras}</span>
                        </div>
                        <div class="detail-row">
                            <span>🟡 Neutras (7-8)</span>
                            <span style="font-weight: 700; color: #ffc107;">${vendas.neutras}</span>
                        </div>
                        <div class="detail-row">
                            <span>🔴 Detratoras (0-6)</span>
                            <span style="font-weight: 700; color: #dc3545;">${vendas.detratoras}</span>
                        </div>
                        <div class="detail-row">
                            <span><strong>Total de Respostas</strong></span>
                            <span style="font-weight: 700;">${totalVendas}</span>
                        </div>
                    </div>
                </div>

                <!-- PÓS-VENDAS -->
                <div class="detail-section" style="margin-top: 20px;">
                    <div class="detail-title">Pós-Vendas</div>
                    <div class="detail-row">
                        <span>NPS</span>
                        <span style="font-weight: 700; font-size: 20px; color: ${npsPosvenda >= posvenda.meta ? '#28a745' : '#dc3545'};">${npsPosvenda}</span>
                    </div>
                    <div class="detail-row">
                        <span>Meta</span>
                        <span style="font-weight: 700;">${posvenda.meta}</span>
                    </div>
                    ${posvrendaFaltam > 0 ? `
                        <div class="meta-alert">
                            ⚠️ Faltam <strong>${posvrendaFaltamNotas} notas promotoras</strong> para atingir a meta
                        </div>
                    ` : `
                        <div class="meta-alert meta-success">
                            ✅ Meta atingida!
                        </div>
                    `}

                    <div style="margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 6px;">
                        <div class="detail-row">
                            <span>🟢 Promotoras (9-10)</span>
                            <span style="font-weight: 700; color: #28a745;">${posvenda.promotoras}</span>
                        </div>
                        <div class="detail-row">
                            <span>🟡 Neutras (7-8)</span>
                            <span style="font-weight: 700; color: #ffc107;">${posvenda.neutras}</span>
                        </div>
                        <div class="detail-row">
                            <span>🔴 Detratoras (0-6)</span>
                            <span style="font-weight: 700; color: #dc3545;">${posvenda.detratoras}</span>
                        </div>
                        <div class="detail-row">
                            <span><strong>Total de Respostas</strong></span>
                            <span style="font-weight: 700;">${totalPosvenda}</span>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function atualizarHora() {
            const agora = new Date();
            document.getElementById('last-update-time').textContent =
                `Última atualização: ${agora.toLocaleTimeString('pt-BR')}`;
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            criarCardAvaliacoes();
            criarCardNPS();
            atualizarHora();
            setInterval(atualizarHora, 60000); // Atualiza a hora a cada minuto
        });

        // Fechar modal ao clicar fora
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
